<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 480" width="1500" height="480" role="img" aria-labelledby="demoTitle demoDesc">
<title id="demoTitle">Construction English: real learning flow</title>
<desc id="demoDesc">A three-step demonstration of the Duct Bank / Electrical vocabulary pack, the actual duct bank technical diagram, and Smart 10 practice and progress. The highlighted step advances every three seconds.</desc>
<defs>
 <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111923"/><stop offset="1" stop-color="#173e36"/></linearGradient>
</defs>
<style>
.phase-card{filter:drop-shadow(0 8px 20px rgba(0,0,0,.09))}
.phase-1{animation:p1 9s ease-in-out infinite}
.phase-2{animation:p2 9s ease-in-out infinite}
.phase-3{animation:p3 9s ease-in-out infinite}
@keyframes p1{0%,28%,100%{opacity:1}33%,95%{opacity:.7}}
@keyframes p2{0%,27%,72%,100%{opacity:.7}33%,63%{opacity:1}}
@keyframes p3{0%,61%{opacity:.7}68%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){.phase-card{animation:none!important;opacity:1!important}}
</style>
<rect x="0" y="0" width="1500" height="480" rx="28" fill="url(#back)" />
<text x="36" y="52" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="750" >CONSTRUCTION ENGLISH</text>
<text x="36" y="83" fill="#c3d8d1" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="450" >Learn terms from real civil drawings, estimates and site work</text>
<g class="phase-card phase-1">
   <rect x="36" y="115" width="436" height="318" rx="24" fill="#f8faf9" stroke="#c9d9d3" stroke-width="2"/>
   <rect x="58" y="136" width="38" height="38" rx="12" fill="#1c6b52" />
   <text x="77" y="162" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="middle">1</text>
   <text x="113" y="163" fill="#18212b" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" >Choose your path</text>
   <text x="59" y="194" fill="#4b615c" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="450" >Focus on the work you do</text>
   
 <rect x="58" y="220" width="390" height="78" rx="14" fill="#e8f4ee" stroke="#62a48b" stroke-width="2"/>
 <text x="78" y="254" fill="#185c47" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" >Duct Bank / Electrical</text>
 <text x="78" y="279" fill="#34685a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="450" >22 terms · underground utilities</text>
 <rect x="58" y="316" width="390" height="66" rx="14" fill="#e6ebef" />
 <text x="78" y="357" fill="#3a5257" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" >Civil Starter · Underground Utilities</text>
 <text x="58" y="413" fill="#536961" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" >Role-based learning packs</text>

 </g>
<g class="phase-card phase-2">
   <rect x="532" y="115" width="436" height="318" rx="24" fill="#f8faf9" stroke="#c9d9d3" stroke-width="2"/>
   <rect x="554" y="136" width="38" height="38" rx="12" fill="#1c6b52" />
   <text x="573" y="162" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="middle">2</text>
   <text x="609" y="163" fill="#18212b" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" >See the construction</text>
   <text x="555" y="194" fill="#4b615c" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="450" >Diagram from the actual vocabulary</text>
   
 <rect x="552" y="211" width="396" height="180" rx="16" fill="#eaf4f1" />
 <svg x="584" y="223" width="331" height="141" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid meet"><style>.tv-label{font:700 11px system-ui,sans-serif;fill:#244f42;letter-spacing:.03em}
.tv-small{font:600 8px system-ui,sans-serif;fill:#536c64}
.tv-ground-line{fill:none;stroke:#6b7d70;stroke-width:3}
.tv-ground{fill:#d9d1bd}
.tv-pipe-ring,.tv-conduit-big{fill:#f8faf9;stroke:#566a63;stroke-width:5}
.tv-concrete{fill:#d8d8d4;stroke:#777c79;stroke-width:2}
.tv-conduit circle,.tv-conduit-big{fill:#f7faf9;stroke:#4e7567;stroke-width:4}
.tv-concrete-profile{fill:#c8c9c5;stroke:#696e6c;stroke-width:2}</style><path class="tv-ground" d="M0 28h320v132H0z"/><rect class="tv-concrete" x="78" y="52" width="164" height="88" rx="3"/><g class="tv-conduit"><circle cx="112" cy="82" r="14"/><circle cx="160" cy="82" r="14"/><circle cx="208" cy="82" r="14"/><circle cx="112" cy="116" r="14"/><circle cx="160" cy="116" r="14"/><circle cx="208" cy="116" r="14"/></g><text class="tv-label" x="118" y="42">DUCT BANK</text><text class="tv-small" x="104" y="158">CONCRETE ENCASEMENT</text></svg>
 <text x="568" y="418" fill="#1b5d4d" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" >duct bank</text>

 </g>
<g class="phase-card phase-3">
   <rect x="1028" y="115" width="436" height="318" rx="24" fill="#f8faf9" stroke="#c9d9d3" stroke-width="2"/>
   <rect x="1050" y="136" width="38" height="38" rx="12" fill="#1c6b52" />
   <text x="1069" y="162" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="middle">3</text>
   <text x="1105" y="163" fill="#18212b" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" >Practice and review</text>
   <text x="1051" y="194" fill="#4b615c" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="450" >Built-in spaced learning</text>
   
 <rect x="1048" y="220" width="396" height="69" rx="14" fill="#edf4f0" />
 <text x="1070" y="265" fill="#1b644e" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" >Start Smart 10</text>
 <text x="1052" y="323" fill="#233c3a" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500" >Practice with visual diagrams</text>
 <text x="1052" y="352" fill="#233c3a" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500" >Review your words over time</text>
 <text x="1052" y="412" fill="#667886" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="450" >Practice My Words when ready</text>

 </g>
</svg>
