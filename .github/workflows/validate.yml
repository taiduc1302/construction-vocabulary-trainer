name: Validate vocabulary

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare audit logs
        run: mkdir -p audit-logs

      - name: Validate vocabulary structure
        id: terms
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/validate-terms.mjs 2>&1 | tee audit-logs/terms.txt

      - name: Audit vocabulary content
        id: content
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/audit-content.mjs 2>&1 | tee audit-logs/content.txt

      - name: Validate visuals and drawing contracts
        id: visuals
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/validate-visuals.mjs 2>&1 | tee audit-logs/visuals.txt

      - name: Validate PWA dependency contract
        id: pwa
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/validate-pwa.mjs 2>&1 | tee audit-logs/pwa.txt

      - name: Test learning state behavior
        id: learning
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/test-learning-state.mjs 2>&1 | tee audit-logs/learning-state.txt

      - name: Test practice engine behavior
        id: practice
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/test-practice-engine.mjs 2>&1 | tee audit-logs/practice-engine.txt

      - name: Test Drawing Challenge behavior
        id: drawing
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/test-drawing-challenges.mjs 2>&1 | tee audit-logs/drawing-challenges.txt

      - name: Test estimator learning content
        id: learningcontent
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/test-learning-content.mjs 2>&1 | tee audit-logs/learning-content.txt

      - name: Test ChatGPT add-word bridge
        id: onboarding
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/test-onboarding.mjs 2>&1 | tee audit-logs/onboarding.txt

      - name: Validate release delivery gate
        id: delivery
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/validate-delivery.mjs 2>&1 | tee audit-logs/delivery.txt

      - name: Validate mobile UX contract
        id: ux
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/validate-ux.mjs 2>&1 | tee audit-logs/ux.txt

      - name: Check JavaScript syntax
        id: syntax
        continue-on-error: true
        run: |
          set -o pipefail
          {
            node --check src/app.js
            node --check src/ui-enhancements.js
            node --check src/onboarding.js
            node --check src/learning-state.js
            node --check src/practice-engine.js
            node --check src/drawing-challenges.js
            node --check src/visuals.js
            node --check src/visuals-extra.js
            node --check src/visuals-all.js
            node --check src/register-sw.js
            node --check sw.js
          } 2>&1 | tee audit-logs/syntax.txt

      - name: Validate manifest JSON
        id: manifest
        continue-on-error: true
        run: |
          set -o pipefail
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('Manifest JSON OK')" 2>&1 | tee audit-logs/manifest.txt

      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-logs-${{ github.run_id }}
          path: audit-logs/
          if-no-files-found: error
          retention-days: 14

      - name: Fail if any audit check failed
        if: always()
        env:
          TERMS: ${{ steps.terms.outcome }}
          CONTENT: ${{ steps.content.outcome }}
          VISUALS: ${{ steps.visuals.outcome }}
          PWA: ${{ steps.pwa.outcome }}
          LEARNING: ${{ steps.learning.outcome }}
          PRACTICE: ${{ steps.practice.outcome }}
          DRAWING: ${{ steps.drawing.outcome }}
          LEARNING_CONTENT: ${{ steps.learningcontent.outcome }}
          ONBOARDING: ${{ steps.onboarding.outcome }}
          DELIVERY: ${{ steps.delivery.outcome }}
          UX: ${{ steps.ux.outcome }}
          SYNTAX: ${{ steps.syntax.outcome }}
          MANIFEST: ${{ steps.manifest.outcome }}
        run: |
          printf 'terms=%s\ncontent=%s\nvisuals=%s\npwa=%s\nlearning=%s\npractice=%s\ndrawing=%s\nlearning_content=%s\nonboarding=%s\ndelivery=%s\nux=%s\nsyntax=%s\nmanifest=%s\n' "$TERMS" "$CONTENT" "$VISUALS" "$PWA" "$LEARNING" "$PRACTICE" "$DRAWING" "$LEARNING_CONTENT" "$ONBOARDING" "$DELIVERY" "$UX" "$SYNTAX" "$MANIFEST"
          if [ "$TERMS" != success ] || [ "$CONTENT" != success ] || [ "$VISUALS" != success ] || [ "$PWA" != success ] || [ "$LEARNING" != success ] || [ "$PRACTICE" != success ] || [ "$DRAWING" != success ] || [ "$LEARNING_CONTENT" != success ] || [ "$ONBOARDING" != success ] || [ "$DELIVERY" != success ] || [ "$UX" != success ] || [ "$SYNTAX" != success ] || [ "$MANIFEST" != success ]; then
            echo 'One or more audit checks failed. See the uploaded audit logs artifact.'
            exit 1
          fi
